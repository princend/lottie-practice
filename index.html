<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lottie 動畫展示 - Leaf Globe</title>
  <meta name="description" content="精美的 Lottie 動畫網頁展示與互動播放器，支援倍速調整、時間軸拖曳與多種背景模式。">
  <!-- Google 字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- 樣式表 -->
  <link rel="stylesheet" href="style.css">
  <!-- Lottie Web Player CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>
  <div class="background-decorations">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <div class="app-container">
    <!-- 頂部標題區 -->
    <header class="app-header">
      <div class="badge">
        <span class="badge-dot"></span>
        <span>Lottie Animation Showcase</span>
      </div>
      <h1 class="page-title">Leaf Globe Animation</h1>
      <p class="page-subtitle">現代化 Lottie 動畫即時渲染與互動控制展示</p>
    </header>

    <!-- 主要內容區 -->
    <main class="showcase-card">
      <!-- 畫布/預覽區 -->
      <div class="preview-wrapper">
        <div class="preview-header">
          <div class="window-controls">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
          </div>
          <span class="file-name-label" id="fileNameLabel">leafglobe.json</span>
          <div class="bg-mode-selector" title="切換畫布背景">
            <button class="bg-btn active" data-bg="dark" title="深色背景">
              <span class="bg-icon bg-dark-icon"></span>
            </button>
            <button class="bg-btn" data-bg="light" title="淺色背景">
              <span class="bg-icon bg-light-icon"></span>
            </button>
            <button class="bg-btn" data-bg="slate" title="石板藍背景">
              <span class="bg-icon bg-slate-icon"></span>
            </button>
            <button class="bg-btn" data-bg="grid" title="透明格紋">
              <span class="bg-icon bg-grid-icon"></span>
            </button>
          </div>
        </div>

        <div class="canvas-container bg-dark" id="canvasContainer">
          <div id="lottieContainer" class="lottie-view"></div>
          <div id="loadingOverlay" class="loading-overlay">
            <div class="spinner"></div>
            <p>載入動畫中...</p>
          </div>
        </div>
      </div>

      <!-- 控制面板區 -->
      <div class="controls-panel">
        <!-- 進度與時間軸 -->
        <div class="timeline-section">
          <div class="timeline-info">
            <span class="time-text" id="currentTimeText">00:00</span>
            <span class="frame-text" id="currentFrameText">Frame: 0 / 0</span>
            <span class="time-text" id="totalTimeText">00:00</span>
          </div>
          <div class="progress-bar-container">
            <input type="range" id="progressBar" class="progress-slider" min="0" max="100" step="0.1" value="0" aria-label="動畫進度條">
          </div>
        </div>

        <!-- 主要按鈕區 -->
        <div class="control-actions">
          <!-- 播放/暫停/重播 -->
          <div class="action-group main-playback-group">
            <button id="btnPlayPause" class="btn btn-primary" title="播放 / 暫停 (Space)">
              <svg id="iconPlay" class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <svg id="iconPause" class="btn-icon hidden" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
              <span id="labelPlayPause">播放</span>
            </button>

            <button id="btnRestart" class="btn btn-secondary" title="重新開始">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
              <span>重播</span>
            </button>

            <button id="btnLoop" class="btn btn-secondary active-toggle" title="切換循環播放">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="17 1 21 5 17 9"/>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <polyline points="7 23 3 19 7 15"/>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
              </svg>
              <span id="labelLoop">循環：開啟</span>
            </button>
          </div>

          <!-- 播放速度選擇 -->
          <div class="action-group speed-group">
            <span class="group-label">速度：</span>
            <div class="speed-buttons">
              <button class="btn-chip" data-speed="0.5">0.5x</button>
              <button class="btn-chip active" data-speed="1.0">1.0x</button>
              <button class="btn-chip" data-speed="1.5">1.5x</button>
              <button class="btn-chip" data-speed="2.0">2.0x</button>
            </div>
          </div>
        </div>

        <!-- 檔案屬性與下載區 -->
        <div class="metadata-section">
          <div class="meta-card">
            <span class="meta-title">原始解析度</span>
            <span class="meta-value" id="metaDimensions">400 × 400 px</span>
          </div>
          <div class="meta-card">
            <span class="meta-title">總幀數 / 幀率</span>
            <span class="meta-value" id="metaFrames">76 幀 @ 25 fps</span>
          </div>
          <div class="meta-card">
            <span class="meta-title">動畫時長</span>
            <span class="meta-value" id="metaDuration">3.04 秒</span>
          </div>
          <div class="meta-card">
            <span class="meta-title">檔案大小</span>
            <span class="meta-value" id="metaSize">~48 KB</span>
          </div>
        </div>

        <!-- 檔案下載與連結 -->
        <div class="footer-actions">
          <a id="downloadJsonBtn" href="leafglobe.json" download="leafglobe.json" class="btn btn-outline">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>下載 JSON 動畫檔</span>
          </a>
          <a href="https://github.com/princend/lottie-practice" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <span>GitHub 倉庫</span>
          </a>
        </div>
      </div>
    </main>

    <!-- 頁尾 -->
    <footer class="app-footer">
      <p>Powered by <a href="https://airbnb.io/lottie/" target="_blank" rel="noopener noreferrer">Lottie Web</a> &bull; Deployed with GitHub Pages</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
